buildscript {
    repositories {
        mavenCentral()
        maven { url = 'https://maven.minecraftforge.net/' }
    }
    dependencies {
        // anatawa12's FG 2.3 fork: upstream FG 2.3 needs forge-userdev.jar, which is no longer published.
        classpath group: 'com.anatawa12.forge', name: 'ForgeGradle', version: '2.3-1.0.+'
    }
}
apply plugin: 'net.minecraftforge.gradle.forge'
// Only edit below this line, the above code adds and enables the necessary things for Forge to be setup.
apply plugin: 'eclipse'

version = "${mcmt_ver}"
group = 'org.jmt.mcmt'
archivesBaseName = "jmt_mcmt-${mc_ver}"

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'

println('Java: ' + System.getProperty('java.version') + ' JVM: ' + System.getProperty('java.vm.version') + '(' + System.getProperty('java.vendor') + ') Arch: ' + System.getProperty('os.arch'))

minecraft {
    version = "${mc_ver}-${fg_ver}"
    mappings = "${mappings_chan}_${mappings_ver}"
    runDir = "run"

}

// FG 2.3 exposes runServer as a JavaExec task. The coremod is loaded before the mod,
// so dev runs must point FML at it explicitly.
runServer {
    workingDir project.file('run')
    systemProperty 'fml.coreMods.load', 'org.jmt.mcmt.coremod.MCMTLoadingPlugin'
    // Dev jars are unsigned; FMLSanityChecker would otherwise refuse to boot.
    systemProperty 'fml.ignoreInvalidMinecraftCertificates', 'true'
    // -Dmcmt.devchurn=true enables the DevChurn race harness (see coremod/AGENTS.md);
    // -Dmcmt.debug=true enables tick-list size warnings. Both default off in the forked server JVM.
    // systemProperty (not jvmArgs): FG's own argument list overwrites jvmArgs.
    for (String p : ['mcmt.devchurn', 'mcmt.debug', 'mcmt.dump', 'mcmt.churn.iterations', 'mcmt.churn.maxmillis',
                     'mcmt.churn.parallelEntities', 'mcmt.churn.parallelTE', 'mcmt.churn.parallelEnv']) {
        // -P sets project properties; -D sets system properties — accept both.
        String v = (String) project.findProperty(p)
        if (v == null)
            v = System.getProperty(p)
        if (v != null)
            systemProperty p, v
    }
}

jar {
    manifest {
        attributes([
            "FMLCorePlugin": "org.jmt.mcmt.coremod.MCMTLoadingPlugin",
            "FMLCorePluginContainsFMLMod": "true",
            "FMLAT": "accesstransformer.cfg",
            "Implementation-Title": project.name,
            "Implementation-Version": "${version}",
            "Implementation-Vendor": "jmtmakesthings",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': project.minecraft.version
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}
