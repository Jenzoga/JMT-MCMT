buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = "${mcmt_ver}"
group = 'org.jmt.mcmt' // http://maven.apache.org/guides/mini/guide-naming-conventions.html
base.archivesName = "jmt_mcmt-${mc_ver}"

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

repositories {
    maven { url = 'https://maven.minecraftforge.net/' }
    mavenCentral()
}

println('Java: ' + System.getProperty('java.version') + ' JVM: ' + System.getProperty('java.vm.version') + '(' + System.getProperty('java.vendor') + ') Arch: ' + System.getProperty('os.arch'))
minecraft {
    // 1.20.1 uses Mojang's official mappings (Mojmap); no MCP/SRG channel anymore.
    mappings channel: "${mappings_chan}", version: "${mappings_ver}"

    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            workingDirectory project.file('run')

            // Recommended logging level for the console
            property 'forge.logging.console.level', 'debug'

            mods {
                jmt_mcmt {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')

            // Recommended logging level for the console
            property 'forge.logging.console.level', 'debug'

            mods {
                jmt_mcmt {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'

            // Recommended logging level for the console
            property 'forge.logging.console.level', 'debug'

            args '--mod', 'jmt_mcmt', '--all', '--output', file('src/generated/resources/')

            mods {
                jmt_mcmt {
                    source sourceSets.main
                }
            }
        }
    }
}

dependencies {
    // Specify the version of Minecraft to use, If this is any group other then 'net.minecraft' it is assumed
    // that the dep is a ForgeGradle 'patcher' dependency. And it's patches will be applied.
    // The userdev artifact is a special name and will get all sorts of transformations applied to it.
    minecraft "net.minecraftforge:forge:${mc_ver}-${fg_ver}"
}

// Example for how to get properties into the manifest for reading by the runtime..
// Single-jar packaging: this jar is the mod itself (mods.toml, coremods.json,
// access transformer, JS coremod scripts and classes all live inside it).
jar {
	from sourceSets.main.output
    manifest {
        attributes([
            "Specification-Title": "jmt_mcmt",
            "Specification-Vendor": "jmtmakesthings",
            "Specification-Version": "1", // We are version 1 of ourselves
            "Implementation-Title": project.name,
            "Implementation-Version": "${version}",
            "Implementation-Vendor" :"jmtmakesthings",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            // Coremods must be declared via manifest attribute since FML 1.17+
            "CoreModFile": "META-INF/coremods.json"
        ])
    }
}

task cleanModToml(type: Delete) {
  delete 'src/main/resources/META-INF/mods.toml'
  followSymlinks = true
}

import org.apache.tools.ant.filters.*

task generateModToml(type: Copy) {
	def fgMajor = fg_ver.tokenize(".")[0]
	from 'src/main/resources/META-INF/template'
    into 'src/main/resources/META-INF'
    filter(ReplaceTokens, tokens: [
        FORGE_VER: fgMajor,
        MC_VER: mc_ver
    ])
}

configure(cleanModToml) {
	group = 'Build'
	description = 'Clean in the mod toml'
}

clean.dependsOn cleanModToml
generateModToml.dependsOn cleanModToml


configure(generateModToml) {
	group = 'Build'
	description = 'Fill in the mod toml'
}

processResources.dependsOn generateModToml

// Example configuration to allow publishing using the maven-publish task
// This is the preferred method to reobfuscate your jar file
jar.finalizedBy('reobfJar')
// However if you are in a multi-project build, dev time needs unobfed jar files, so you can delay the obfuscation until publishing by doing
//publish.dependsOn('reobfJar')

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file:///${project.projectDir}/mcmodsrepo"
        }
    }
}
